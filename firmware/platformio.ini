; platformio.ini — Instrumento Ludico-Pedagogico ESP32
; [VER: 01_arquitetura.md#stack-tecnologico]
; [VER: CODING_STANDARD.md#estrutura-cpp]

; [env] — base herdada por todos os ambientes.
; build_flags: -std=gnu++17 obrigatorio para enum class e constexpr.
; lib_extra_dirs = src: habilita o padrao #include "modulo.h" (sem path-prefix)
; derivado de CODING_STANDARD.md#estrutura-cpp — path-prefix proibido.
[env]
build_flags    = -std=gnu++17
lib_extra_dirs = src

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
upload_port   = COM9
upload_speed  = 115200
lib_deps      =
    fastled/FastLED@>=3.6.0
    ESP32Async/AsyncTCP@^3.0.0
    ESP32Async/ESPAsyncWebServer@^3.0.0
    bblanchon/ArduinoJson@^7.0.0

[env:native]
platform         = native
test_framework   = unity
build_flags      =
    ${env.build_flags}
    -I $PROJECT_DIR/test/mock
build_src_filter = +<sensor/> +<visual/> +<game/>
