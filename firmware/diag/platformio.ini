; platformio.ini — Kit de diagnostico de bancada (projeto SEPARADO do firmware)
; NAO faz parte do V-model: nada aqui deriva de spec. Uso exclusivo em bancada.
; Ver README.md deste diretorio.

[env]
platform      = espressif32
board         = esp32dev
framework     = arduino
upload_port   = COM9
upload_speed  = 115200

; Teste da cadeia WS2812B (onda quadrada p/ multimetro + ciclo de cores)
[env:ledtest]
build_src_filter = -<*> +<led_test.cpp>
lib_deps         = fastled/FastLED@>=3.6.0

; Teste do init WiFi com TX reduzido + breadcrumbs (diagnostico de brownout)
[env:wifitest]
build_src_filter = -<*> +<wifi_test.cpp>
