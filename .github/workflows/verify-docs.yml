name: Verificação de Documentação

on:
  push:
    paths:
      - '**.md'
      - 'scripts/**'
  pull_request:
    paths:
      - '**.md'
      - 'scripts/**'

jobs:
  verify-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verificar links, versões e vínculos
        run: python scripts/run_all.py
